<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黑板樹 Blackboard Tree</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='20' rx='4' fill='%234263eb'/%3E%3Crect x='12' y='24' width='8' height='4' fill='%234263eb'/%3E%3Ccircle cx='16' cy='14' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 程式出錯時直接顯示在畫面上，方便老師回報問題
    function msFatal(m) {
      if (/ResizeObserver loop/.test(m)) return; // 瀏覽器的無害通知
      var d = document.getElementById('fatal');
      if (!d) { d = document.createElement('pre'); d.id = 'fatal'; (document.body || document.documentElement).appendChild(d); }
      d.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;background:#fff5f5;color:#c92a2a;border:1px solid #ffc9c9;border-radius:8px;padding:8px 12px;max-width:90vw;white-space:pre-wrap;font:12px monospace';
      d.textContent += '錯誤：' + m + '\n';
    }
    window.addEventListener('error', function (e) { msFatal((e.message || '無法載入 ' + (e.target && (e.target.src || e.target.href))) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); }, true);
    window.addEventListener('unhandledrejection', function (e) { var r = e.reason; msFatal(r && (r.message || r.code) ? (r.code ? r.code + ' ' : '') + (r.message || '') : String(r)); });
  </script>
  <script src="vendor/qrcode.js"></script>
  <!-- desktop-scripts -->

  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="login" class="login hidden"></div>

  <div id="app" class="hidden">
    <main id="stage">
      <div id="empty-hint" class="empty-hint hidden">
        <div class="eh-icon" id="eh-icon">👇</div>
        <div id="eh-text">從下方工具列加入計時器、抽籤、文字等小工具</div>
        <small>拖曳標題列移動、拖曳右下角調整大小。按 H 隱藏工具列、F 全螢幕。</small>
      </div>
    </main>

    <header id="topbar" class="chrome">
      <button id="board-btn" class="tb-btn" title="切換白板"><span>☰</span> <b id="board-name"></b> ▾</button>
      <div class="tb-spacer"></div>
      <span id="sync" class="pill"></span>
      <button id="remote-btn" class="tb-btn hidden" title="用手機或平板遙控">📱 <span class="tb-label">遙控</span></button>
      <button id="roster-btn" class="tb-btn" title="班級名單：匯入學生名單與照片">👥 <span class="tb-label">名單</span></button>
      <button id="bg-btn" class="tb-btn" title="背景">🎨 <span class="tb-label">背景</span></button>
      <button id="clear-btn" class="tb-btn" title="清空白板">🧹 <span class="tb-label">清空</span></button>
      <button id="fs-btn" class="tb-btn" title="全螢幕 (F)">⛶ <span class="tb-label">全螢幕</span></button>
      <button id="settings-btn" class="tb-btn" title="設定：白板、班級名單、工具列">⚙ <span class="tb-label">設定</span></button>
      <button id="user-btn" class="tb-btn" title="帳號">👤</button>
    </header>

    <nav id="dock" class="chrome">
      <div id="dock-items"></div>
    </nav>
    <button id="hide-btn" title="隱藏 / 顯示工具列 (H)">👁</button>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>
</body>
</html>
