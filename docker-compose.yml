# 在 NAS（Synology Container Manager／QNAP Container Station）建立專案時使用
services:
  myscreen:
    build: .
    container_name: myscreen
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # relay：只提供手機遙控轉送（白板仍存在老師的 V:）
      # 若要同時開放「學校帳號登入」，改成 smb 並掛載 config.json
      - MYSCREEN_MODE=relay
    # volumes:
    #   - ./config.json:/app/config.json:ro
